name = "ssocks"
# x-release-please-start-version
version = "0.1.0"
# x-release-please-end
gleam = ">= 1.18.0 and < 2.0.0"
target = "erlang"

description = "Shadowsocks for Gleam: paste an ss:// URL and connect, or run a server"
licences = ["MIT", "Apache-2.0"]
repository = { type = "github", user = "P4suta", repo = "ssocks" }

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.2.0 and < 2.0.0"
ssocks_codec = { path = "../ssocks_codec" }
glisten = ">= 9.0.0 and < 9.1.0"
mug = ">= 3.1.0 and < 3.2.0"
toss = ">= 1.0.0 and < 1.1.0"
# Direct because the UDP relay names `glip.IpAddress` in its own types: a client
# address is what the session table is keyed on, and toss reports one with every
# datagram.
glip = ">= 1.0.0 and < 1.1.0"

[dev_dependencies]
gleeunit = ">= 1.9.0 and < 1.12.0"
argv = ">= 1.0.0 and < 2.0.0"
