---
# SPDX-FileCopyrightText: 2026 ssocks contributors
# SPDX-License-Identifier: MIT OR Apache-2.0

name: CI

"on":
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MISE_AUTO_INSTALL: "false"
  REQUIRED_GATE: |
    def gate:
      type == "object"
      and ((keys | sort) == ["changes", "check", "docs", "interop"])
      and all(.[]; type == "object")
      and .changes.result == "success"
      and (.changes.outputs | type == "object")
      and (.changes.outputs.runtime as $runtime
        | ($runtime == "true" or $runtime == "false")
        and ([.check.result, .docs.result, .interop.result]
          | all(.[]; . == (if $runtime == "true" then "success" else "skipped" end))));

jobs:
  changes:
    name: Workflow and metadata checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      runtime: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.paths.outputs.runtime }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: paths
        with:
          base: ${{ github.event.merge_group.base_sha || github.event.repository.default_branch }}
          filters: .github/filters/ci.yml
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1
        with:
          version: v2026.10.14
          install_args: typos taplo actionlint gitleaks uv yamllint rumdl jq yq
          experimental: true
      - run: mise run lint
      - run: rumdl check .
      - name: Verify the required gate
        shell: bash
        run: |
          jq --null-input --exit-status "${REQUIRED_GATE}"'
            def sample($selector; $states):
              {changes: {result: $states[0], outputs: {runtime: $selector}},
               check: {result: $states[1]}, docs: {result: $states[2]},
               interop: {result: $states[3]}};
            [sample("true"; ["success", "success", "success", "success"]),
             sample("false"; ["success", "skipped", "skipped", "skipped"])] as $valid
            | ["true", "false", null, "", "unknown", true, false] as $selectors
            | ["success", "failure", "cancelled", "skipped", null, "", "unknown"] as $states
            | [$selectors[] as $selector
               | $states[] as $changes
               | $states[] as $check
               | $states[] as $docs
               | $states[] as $interop
               | sample($selector; [$changes, $check, $docs, $interop])
               | . as $candidate
               | (gate) == ($valid | any(.[]; . == $candidate))] as $checks
            | [null, [], {}, ($valid[0] | del(.check)),
               ($valid[0] | del(.changes.outputs)),
               ($valid[0] | .changes.outputs = []),
               ($valid[0] | .interop = "invalid")] as $invalid
            | if (($checks | length) == 16807 and all($checks[]; .)
                  and all($invalid[]; gate | not))
              then {checked: 16814}
              else false
              end
          '
      - name: Every job contributes to the required gate
        shell: bash
        run: |
          yq -o=json .github/workflows/ci.yml |
            jq --exit-status '(.jobs.required.needs | sort) == (.jobs | keys - ["required"] | sort)'

  check:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1
        with:
          version: v2026.10.14
          install_args: gleam erlang node deno bun
          experimental: true
      - run: mise run deps
      - run: mise run fmt
      - run: mise run build
      - run: mise run test
      - run: mise run test-cross
      - run: mise run backends

  interop:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1
        with:
          version: v2026.10.14
          install_args: gleam erlang node
          experimental: true
      - run: mise run interop-fetch
      - run: mise run deps
      - run: mise run interop

  docs:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1
        with:
          version: v2026.10.14
          install_args: gleam erlang
          experimental: true
      - run: mise run deps
      - run: mise run docs-codec
      - run: mise run docs-net

  required:
    name: required
    if: always()
    needs: [changes, check, interop, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde  # v5.2.1
        with:
          version: v2026.10.14
          install_args: jq
          experimental: true
      - name: Require every selected job to pass
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq --exit-status "${REQUIRED_GATE} gate" <<< "${NEEDS}"
