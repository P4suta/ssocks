# `lefthook.yml` runs `committed` on every commit message, and until this file
# existed it ran with defaults that rejected every commit in this repository's
# history — lowercase conventional subjects, subjects over fifty characters, and
# bodies wrapped at eighty. The hook had never actually run: `lefthook install`
# fails on a machine with a custom `core.hooksPath`, so nothing ever tried it.
#
# A gate that would refuse the history it is guarding is not a gate. These are
# the rules this repository actually follows, measured from that history.

style = "conventional"

# Conventional subjects begin with a lowercase type. Capitalising them would
# mean rewriting every commit here.
subject_capitalized = false
subject_not_punctuated = true

# Long enough for `fix(udp): say so when stop ran out of time, and quote
# nothing into PowerShell`, which is the longest subject written so far and
# says more for being long.
subject_length = 80

# Bodies are prose, wrapped by hand near eighty.
line_length = 80
hard_line_length = 0

# `imperative_subject` is off because the subjects here are usually noun
# phrases naming what arrived — "the UDP relay, with a NAT table" — rather than
# instructions to the reader.
imperative_subject = false

# The default list has neither `ci` nor `build`, both of which this repository
# uses.
allowed_types = [
  "build",
  "chore",
  "ci",
  "docs",
  "feat",
  "fix",
  "perf",
  "refactor",
  "style",
  "test",
]

no_fixup = true
no_wip = true

# Two kinds of commit here are written by GitHub rather than by anybody, and
# neither passes through this hook, which runs on `commit-msg` and so only ever
# sees a message composed locally.
#
# The first is `8709d24`, the merge of pull request #1, and it is the only one:
# merge and rebase merges are both off on the remote now. It will not pass a
# lint over a range, and nothing can be done about that without rewriting
# history.
#
# The second is every merge from here on. Squash is the only method left, so a
# merged pull request arrives as an ordinary single-parent commit whose subject
# is the pull request's title — linted like any other commit by anyone who
# lints a range. Title a pull request the way you would write the subject.
