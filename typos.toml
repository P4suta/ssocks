[default]
extend-ignore-re = [
  # Protocol test vectors are hex, and hex is full of runs that read as
  # misspelled words. Anything eight or more hex digits long is data.
  "\b[0-9a-f]{8,}\b",
]

[default.extend-words]
# Belt and braces for the hex above: these appear inside published test
# vectors, where they are bytes rather than prose.
ba = "ba"
